<!-- File: /index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Battery monitor — Web Bluetooth</title>
  <style>
    :root{
      --text:#e7eef7; --muted:#9fb6d9; --accent:#2b78ff;
      --bg:#0a0f16; --panel:#0f1520; --border:#23324a;
      --ok:#1db954; --warn:#ffb020; --err:#ef3921;
    }
    *{box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none}
    .app{width:min(420px,100vw);height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:10px;overflow:hidden}

    /* Topbar */
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
    #statusBar{font-weight:600;opacity:.9;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #btn-bt{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-weight:700}
    #btn-bt[disabled]{opacity:.5;pointer-events:none}

    /* Metrics */
    .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px}
    .power-line{display:flex;align-items:baseline;gap:10px}
    #powerVal{font-weight:800;letter-spacing:.3px;font-size:44px;line-height:1}
    .unit{opacity:.7;font-size:14px;font-weight:700}
    .va-line{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
    .tile{background:#0c121c;border:1px solid var(--border);border-radius:12px;padding:8px}
    .label{font-size:11px;opacity:.75}
    .value{margin-top:2px;font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:6px}
    .switches{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
    .sw{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 8px;border-radius:10px;border:1px solid var(--border);background:#0b121b}
    .meta-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .pill{font-size:11px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:#0c121b;white-space:nowrap}
    .pill.ok{border-color:#16351f}
    .pill.warn{border-color:#3a2d12}
    .pill.err{border-color:#3b1716;background:#1a0b0b}

    /* Tabs */
    .tabs{display:flex;gap:6px}
    .tab-btn{flex:1;height:34px;border-radius:10px;border:1px solid var(--border);background:#0c121c;color:var(--text);font-weight:700;cursor:pointer}
    .tab-btn.active{background:#142035}
    .panels{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1;overflow:hidden}
    .panel{display:none;min-height:0;flex:1;overflow:auto}
    .panel.active{display:flex;flex-direction:column}

    /* Cells */
    #cellsSimple{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:0}
    .cell-card{background:#0c121c;border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
    .cell-top{display:flex;justify-content:space-between;align-items:center}
    .cell-idx{font-size:11px;opacity:.7}
    .cell-val{font-weight:700;font-size:16px}
    .cell-bar{height:6px;border-radius:6px;background:#0f1520;border:1px solid #1b2941;overflow:hidden}
    .cell-fill{height:100%;width:0%;background:linear-gradient(90deg,#2b78ff,#42f59e)}
    .cell-flag{font-size:10px;opacity:.85}
    .flag-min{color:#ff7676}
    .flag-max{color:#6fb7ff}

    /* Raw info */
    #rawInfo{display:none;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,Monaco,monospace;font-size:12px;line-height:1.3;background:#0b111a;border:1px dashed var(--border);border-radius:10px;padding:10px}

    /* Chart */
    #chartWrap{border:1px solid var(--border);border-radius:12px;overflow:hidden}
    #chart{width:100%;height:220px;display:block;background:#0b111a}

    /* Dialog */
    dialog{border:0;border-radius:12px;padding:12px;background:var(--panel);color:var(--text)}
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <div id="statusBar">Battery monitor — Idle</div>
      <button id="btn-bt" title="Bluetooth">BT</button>
    </div>

    <div class="card">
      <div class="power-line">
        <span id="powerVal">—</span><span class="unit">W</span>
      </div>
      <div class="va-line">
        <div class="tile">
          <div class="label">Вольты</div>
          <div class="value"><span id="voltVal">—</span><span class="unit">V</span></div>
        </div>
        <div class="tile">
          <div class="label">Амперы</div>
          <div class="value"><span id="ampVal">—</span><span class="unit">A</span></div>
        </div>
        <div class="tile">
          <div class="label">SOC</div>
          <div class="value"><span id="socVal">—</span><span class="unit">%</span></div>
        </div>
        <div class="tile">
          <div class="label">Остаток</div>
          <div class="value"><span id="capRemVal">—</span><span class="unit">Ah</span></div>
        </div>
        <div class="tile">
          <div class="label">Время</div>
          <div class="value"><span id="etaVal">—</span></div>
        </div>
      </div>
      <div class="switches">
        <label class="sw"><input id="showRaw" type="checkbox">Raw</label>
      </div>
      <div class="meta-line">
        <div class="pill ok" id="balancingPill">Balancing: OFF</div>
        <div class="pill" id="tempsPill">T1 — °C · T2 — °C</div>
        <div class="pill ok" id="errorsPill">OK</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button id="tab-cells-btn" class="tab-btn active">Ячейки</button>
      <button id="tab-chart-btn" class="tab-btn">График</button>
    </div>
    <div class="panels">
      <div id="tab-cells" class="panel active" role="tabpanel" aria-labelledby="tab-cells-btn">
        <div id="cellsSimple" aria-label="Поклеточные напряжения"></div>
      </div>
      <div id="tab-chart" class="panel" role="tabpanel" aria-labelledby="tab-chart-btn">
        <div id="chartWrap"><canvas id="chart"></canvas></div>
      </div>
    </div>

    <div id="rawInfo"></div>

    <!-- Picker -->
    <dialog id="dlg-picker">
      <h3 style="margin:0 0 8px 0">Подключение JK/JBD (BLE)</h3>
      <div style="opacity:.8;font-size:12px">PIN вводится системным окном (обычно 123456). Web Bluetooth не даёт «сканирование 15с», только системный выбор устройства.</div>
      <div style="display:flex;gap:8px;align-items:center;margin:8px 0">
        <button id="btn-choose" style="height:32px;padding:0 12px;border-radius:8px;border:0;cursor:pointer;background:var(--accent);color:#fff">Выбрать устройство…</button>
        <button id="btn-reconnect" style="height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:#131b27;color:var(--text)">Недавние</button>
        <span id="picker-status" style="font-size:12px;opacity:.8"></span>
      </div>
      <div id="recent-list" hidden style="max-height:36vh;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:6px;background:#0f1520"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button id="btn-close-picker" style="height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:#131b27;color:var(--text)">Закрыть</button>
      </div>
    </dialog>
  </div>

<script>
'use strict';

/* DOM */
const $ = sel => document.querySelector(sel);
const statusBar = $('#statusBar');
const btnBtEl = $('#btn-bt');
const rawInfo = $('#rawInfo');

/* HUD refs */
const hudPower = $('#powerVal');
const hudVolt = $('#voltVal');
const hudAmp = $('#ampVal');
const hudSoc = $('#socVal');
const hudCapRem = $('#capRemVal');
const hudEta = $('#etaVal');
const hudBal = $('#balancingPill');
const hudTemps = $('#tempsPill');
const hudErrors = $('#errorsPill');
const showRaw = $('#showRaw');

/* Tabs */
const tabCellsBtn = $('#tab-cells-btn');
const tabChartBtn = $('#tab-chart-btn');
const tabCells = $('#tab-cells');
const tabChart = $('#tab-chart');
function setTab(name){
  const isCells = name==='cells';
  tabCellsBtn.classList.toggle('active', isCells);
  tabChartBtn.classList.toggle('active', !isCells);
  tabCells.classList.toggle('active', isCells);
  tabChart.classList.toggle('active', !isCells);
  tabCellsBtn.setAttribute('aria-selected', String(isCells));
  tabChartBtn.setAttribute('aria-selected', String(!isCells));
  if (!isCells) requestAnimationFrame(resizeChart); // why: при показе графика он может быть 0x0
}
tabCellsBtn.addEventListener('click', ()=>setTab('cells'));
tabChartBtn.addEventListener('click', ()=>setTab('chart'));

/* Cells grid */
const CELL_COUNT = 16;
const cellsSimple = $('#cellsSimple');
const simpleSlots = [];
(function buildCellsSimple(){
  for (let i=0;i<CELL_COUNT;i++){
    const card = document.createElement('div'); card.className='cell-card';
    const top = document.createElement('div'); top.className='cell-top';
    const idx = document.createElement('div'); idx.className='cell-idx'; idx.textContent = `C${String(i+1).padStart(2,'0')}`;
    const val = document.createElement('div'); val.className='cell-val'; val.textContent='—';
    top.appendChild(idx); top.appendChild(val);
    const bar = document.createElement('div'); bar.className='cell-bar';
    const fill = document.createElement('div'); fill.className='cell-fill'; bar.appendChild(fill);
    const flag = document.createElement('div'); flag.className='cell-flag'; flag.textContent='';
    card.appendChild(top); card.appendChild(bar); card.appendChild(flag);
    cellsSimple.appendChild(card);
    simpleSlots.push({cardEl:card, valEl:val, fillEl:fill, flagEl:flag});
  }
})();

/* Chart */
const chartCanvas = document.getElementById('chart');
const chartWrap = document.getElementById('chartWrap');
const ctx = chartCanvas.getContext('2d');
const chartData = [];
const chartTime = [];
const MAX_POINTS = 1000;

function resizeChart(){
  const rect = chartCanvas.getBoundingClientRect();
  const cssW = Math.max(1, Math.floor(rect.width));
  const cssH = Math.max(1, Math.floor(rect.height));
  const dpr = window.devicePixelRatio || 1;
  chartCanvas.width = Math.max(1, Math.floor(cssW * dpr));
  chartCanvas.height = Math.max(1, Math.floor(cssH * dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawChart();
}
window.addEventListener('resize', ()=>requestAnimationFrame(resizeChart), {passive:true});
const ro = new ResizeObserver(()=>requestAnimationFrame(resizeChart));
try{ ro.observe(chartWrap); }catch{}

function drawChart(){
  const w = chartCanvas.clientWidth, h = chartCanvas.clientHeight;
  if (!w || !h) return;
  ctx.clearRect(0,0,chartCanvas.width,chartCanvas.height);

  const gh = h;
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.strokeStyle = '#dadada';
  ctx.lineWidth = 1;
  for (let i=0;i<=5;i++){
    const y = (gh/5)*i;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }
  ctx.restore();

  if (chartData.length<2) {
    drawAxes(gh, w, 0, 1, 0, Date.now(), Date.now());
    return;
  }

  const min = Math.min(...chartData), max = Math.max(...chartData);
  const span = (max-min)||1;

  ctx.beginPath();
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#ef3921';
  chartData.forEach((v,i)=>{
    const x = (i/(chartData.length-1))*w;
    const y = gh - ((v-min)/span)*gh;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  const t0 = chartTime[0] || Date.now();
  const t1 = chartTime[chartTime.length-1] || t0;
  drawAxes(gh, w, min, max, span, t0, t1);
}
function drawAxes(h, w, min, max, span, t0, t1){
  ctx.save();
  ctx.strokeStyle = '#dadada';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,h); ctx.lineTo(w,h); ctx.stroke();

  ctx.fillStyle = '#dadada';
  ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  const ticks = 5;
  for (let i=0;i<=ticks;i++){
    const v = min + (span * i / ticks);
    const y = h - (h * i / ticks);
    const text = `${v.toFixed(0)} W`;
    ctx.fillText(text, 4, Math.max(12, Math.min(h-2, y-2)));
  }
  const xTicks = 4;
  const dt = Math.max(1, (t1 - t0));
  for (let i=0;i<=xTicks;i++){
    const x = (w * i / xTicks);
    const ts = t0 + dt * (i / xTicks);
    const d = new Date(ts);
    const mm = String(d.getMinutes()).padStart(2,'0');
    const ss = String(d.getSeconds()).padStart(2,'0');
    ctx.fillText(`${mm}:${ss}`, Math.max(2, x+4), h-4);
  }
  ctx.restore();
}
function pushChartPoint(v){
  if (chartData.length >= MAX_POINTS) { chartData.shift(); chartTime.shift(); }
  chartData.push(Number.isFinite(v)?v:0);
  chartTime.push(Date.now());
  if (tabChart.classList.contains('active')) drawChart();
}

/* Helpers */
function setStatus(text){ statusBar.textContent = `Battery monitor — ${text}`; }
function map(x,inMin,inMax,outMin,outMax){
  if (!Number.isFinite(x)) return outMin;
  if (Math.abs(inMax-inMin)<1e-9) return outMin;
  return (x-inMin)*(outMax-outMin)/(inMax-inMin)+outMin;
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/* === Простая ETA до 100% по SOC и Остатку === */
const CHG = { MIN_CHG_A: 0.10, MIN_SOC: 0.1 };
function estimateNominalCapacityAhInstant(soc, capRem){
  const s = Number(soc), r = Number(capRem);
  if (!Number.isFinite(s) || !Number.isFinite(r) || s < CHG.MIN_SOC || r <= 0) return NaN;
  return r / (s/100);
}
function estimateChargeEtaHoursSimple(i, soc, capRem){
  if (!Number.isFinite(i) || i <= CHG.MIN_CHG_A) return NaN;
  const Cn = estimateNominalCapacityAhInstant(soc, capRem);
  if (!Number.isFinite(Cn) || Cn <= 0) return NaN;
  const S = clamp(Number(soc)||0, 0, 100);
  if (S >= 100) return 0;
  const remainingAh = Math.max(0, Cn * (1 - S/100));
  return remainingAh / i;
}

/* Switches */
showRaw.addEventListener('change', ()=>{
  rawInfo.style.display = showRaw.checked ? 'block' : 'none';
  if (showRaw.checked) rawInfo.textContent = compileBatInfo();
});

/* BLE UUIDs + STATE */
const UUID = {
  JK_SVC:'0000ffe0-0000-1000-8000-00805f9b34fb',
  JK_CHR:'0000ffe1-0000-1000-8000-00805f9b34fb',
  JBD_SVC:'0000ff00-0000-1000-8000-00805f9b34fb',
  JBD_NOTIFY:'0000ff01-0000-1000-8000-00805f9b34fb',
  JBD_CTRL:'0000ff02-0000-1000-8000-00805f9b34fb',
};
const STATE = {
  totalV:NaN,current:NaN,soc:NaN,capRem:NaN,temp1:NaN,temp2:NaN,tmos:NaN,
  balancing:false,errors:'OK',cells:new Array(CELL_COUNT).fill(NaN),
  lastCellsTs:0,lastSummaryTs:0,
  cfgSoc0mV:NaN, cfgSoc100mV:NaN,
  cfgUvpMv:NaN,  cfgOvpMv:NaN
};
let ble=null, busy=false;

/* BT UI */
btnBtEl.addEventListener('click', async ()=>{
  if (busy) return;
  if (ble && ble.connected){
    busy=true; btnBtEl.textContent='BT…';
    try{ await ble.disconnect(); setStatus('Disconnected'); }
    finally{ busy=false; btnBtEl.textContent='BT'; }
    return;
  }
  document.getElementById('dlg-picker').showModal();
});

/* Picker */
const dlg = document.getElementById('dlg-picker');
const btnChoose = document.getElementById('btn-choose');
const btnReconnect = document.getElementById('btn-reconnect');
const btnClosePicker = document.getElementById('btn-close-picker');
const recentList = document.getElementById('recent-list');
const pickerStatus = document.getElementById('picker-status');

btnClosePicker.addEventListener('click', ()=> dlg.close());

btnReconnect.addEventListener('click', async()=>{
  if (!('bluetooth' in navigator) || !('getDevices' in navigator.bluetooth)){
    pickerStatus.textContent = 'Браузер не поддерживает быстрый доступ к недавним.'; return;
  }
  const list = await navigator.bluetooth.getDevices();
  recentList.innerHTML = '';
  if (!list.length){ recentList.hidden=false; recentList.textContent='Недавних устройств нет'; return; }
  list.forEach(dev=>{
    const item = document.createElement('div');
    item.style.cssText='display:flex;justify-content:space-between;padding:8px;border-radius:8px;border:1px solid var(--border);margin:4px 0';
    item.innerHTML = `<div>${dev.name||'(unnamed)'} <span style="opacity:.7;font-size:12px">${dev.id}</span></div><button style="height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:#131b27;color:var(--text)">Подключить</button>`;
    item.querySelector('button').addEventListener('click', async()=>{ await connectViaGrantedDevice(dev); });
    recentList.appendChild(item);
  });
  recentList.hidden=false;
});

async function chooseDeviceFlow(){
  try{
    pickerStatus.textContent='Открытие системного выбора…';
    const device = await navigator.bluetooth.requestDevice({
      filters:[{services:[UUID.JK_SVC]},{services:[UUID.JBD_SVC]}],
      optionalServices:[UUID.JK_SVC,UUID.JBD_SVC]
    });
    await connectViaGrantedDevice(device);
  }catch(err){
    pickerStatus.textContent = (err && err.name==='NotFoundError')? 'Отменено' :
      (err && err.name==='SecurityError') ? 'Требуется клик по кнопке «Выбрать устройство…»' :
      ('Ошибка: '+(err?.message||err));
    throw err;
  }
}
btnChoose.addEventListener('click', chooseDeviceFlow);

async function connectViaGrantedDevice(device){
  try{
    dlg.close(); busy=true; btnBtEl.textContent='BT…'; setStatus('Connecting…');
    const server = await device.gatt.connect();

    device.addEventListener('gattserverdisconnected', ()=>{
      setStatus('Disconnected');
      btnBtEl.textContent='BT';
    });

    const hasJBD = await server.getPrimaryService(UUID.JBD_SVC).then(()=>true,()=>false);
    const hasJK  = await server.getPrimaryService(UUID.JK_SVC ).then(()=>true,()=>false);
    if (hasJBD){ ble = await makeJbd(server); }
    else if (hasJK){ ble = await makeJk(server); }
    else throw new Error('Поддерживаемые сервисы не найдены');
    ble.onupdate = onStateUpdate;
    ble.onlog = s=> setStatus(s);
    await ble.start();
    rememberLastDevice(device);
    setStatus('Connected'); btnBtEl.textContent='BT✓';
  }catch(err){
    console.error(err); alert('Не удалось подключиться: '+(err?.message||err)); setStatus('Error');
    throw err;
  }finally{ busy=false; }
}

/* Scale for cells */
const DEFAULT_MIN_MV = 2900;
const DEFAULT_MAX_MV = 4200;
function getCellScaleMv(){
  const soc0 = STATE.cfgSoc0mV, soc100 = STATE.cfgSoc100mV;
  if (Number.isFinite(soc0) && Number.isFinite(soc100) && soc100>soc0) return [soc0, soc100];
  const uvp = STATE.cfgUvpMv, ovp = STATE.cfgOvpMv;
  if (Number.isFinite(uvp) && Number.isFinite(ovp) && ovp>uvp) return [uvp, ovp];
  return [DEFAULT_MIN_MV, DEFAULT_MAX_MV];
}

/* UI update */
function onStateUpdate(){
  const v=STATE.totalV, i=STATE.current;
  const w = Number.isFinite(v)&&Number.isFinite(i)? v*i : NaN;

  pushChartPoint(Number.isFinite(w)? w: 0);
  updateHud();
  if (STATE.cells?.length) updateCellsSimple(STATE.cells);
  if (showRaw.checked) rawInfo.textContent = compileBatInfo();
}

/* HUD painter */
function formatEtaHours(hrs){
  if (!Number.isFinite(hrs) || hrs<=0) return '—';
  const h = Math.floor(hrs);
  const m = Math.floor((hrs - h) * 60);
  if (h>=100) return `${h} ч`;
  return `${h} ч ${m} м`;
}
function updateHud(){
  const v=STATE.totalV, i=STATE.current;
  const w = (Number.isFinite(v)&&Number.isFinite(i))? v*i : NaN;

  hudPower.textContent = Number.isFinite(w) ? w.toFixed(Math.abs(w)>=100?0:1) : '—';
  hudVolt.textContent  = Number.isFinite(v) ? v.toFixed(2) : '—';
  hudAmp.textContent   = Number.isFinite(i) ? i.toFixed(2) : '—';
  hudSoc.textContent   = Number.isFinite(STATE.soc) ? STATE.soc.toFixed(0) : '—';
  hudCapRem.textContent= Number.isFinite(STATE.capRem) ? STATE.capRem.toFixed(2) : '—';

  // ETA
  let etaText = '—';
  if (Number.isFinite(STATE.capRem) && Number.isFinite(i)) {
    if (i < -0.01) {
      etaText = formatEtaHours(STATE.capRem / (-i));
    } else if (i >= 0.01) {
      const etaH = estimateChargeEtaHoursSimple(i, STATE.soc, STATE.capRem);
      etaText = Number.isFinite(etaH) ? formatEtaHours(etaH) : 'заряд';
    } else {
      etaText = 'стоп';
    }
  }
  hudEta.textContent = etaText;

  const bal = !!STATE.balancing;
  hudBal.textContent = `Balancing: ${bal?'ON':'OFF'}`;
  hudBal.className = 'pill ' + (bal ? 'ok':'warn');

  const t1 = Number.isFinite(STATE.temp1)? `${STATE.temp1.toFixed(1)}°C` : '—';
  const t2 = Number.isFinite(STATE.temp2)? `${STATE.temp2.toFixed(1)}°C` : '—';
  hudTemps.textContent = `T1 ${t1} · T2 ${t2}`;

  const err = (STATE.errors||'').trim();
  hudErrors.textContent = err && err!=='OK' ? err : 'OK';
  hudErrors.className = 'pill ' + (err && err!=='OK' ? 'err':'ok');
}

/* Raw info */
function compileBatInfo(){
  const v=STATE.totalV, i=STATE.current;
  const w=(Number.isFinite(v)&&Number.isFinite(i))? v*i : NaN;
  const lines=[];
  lines.push(`Pack: ${fmt(v,'V',3)} ${fmt(i,'A',3)} ${fmt(w,'W',1)}`);
  const meta=[];
  if (Number.isFinite(STATE.soc)) meta.push(`SOC ${STATE.soc.toFixed(0)}%`);
  meta.push(`Balancing ${STATE.balancing?'ON':'OFF'}`);
  if (Number.isFinite(STATE.capRem)) meta.push(`${STATE.capRem.toFixed(2)} Ah`);

  if (Number.isFinite(STATE.capRem) && Number.isFinite(i)) {
    if (i < -0.01) {
      meta.push(`ETA ${formatEtaHours(STATE.capRem/(-i))}`);
    } else if (i >= 0.01) {
      const etaH = estimateChargeEtaHoursSimple(i, STATE.soc, STATE.capRem);
      meta.push(`ETA ${Number.isFinite(etaH)?formatEtaHours(etaH):'charge'}`);
      const Cn = estimateNominalCapacityAhInstant(STATE.soc, STATE.capRem);
      if (Number.isFinite(Cn)) meta.push(`C≈${Cn.toFixed(1)}Ah`);
    } else {
      meta.push('ETA stop');
    }
  }

  if (Number.isFinite(STATE.temp1)||Number.isFinite(STATE.temp2)) lines.push(`Temps: ${fmt(STATE.temp1,'°C',1)} ${fmt(STATE.temp2,'°C',1)}`);
  if (STATE.errors && STATE.errors.toUpperCase()!=='OK') lines.push(`Errors: ${STATE.errors}`);

  const act=STATE.cells.filter(x=>Number.isFinite(x)&&x>0);
  if (act.length){
    const sum=act.reduce((a,b)=>a+b,0), min=Math.min(...act), max=Math.max(...act);
    const deltaMv=(max-min)*1000, diffMv=Number.isFinite(v)? (v-sum)*1000 : NaN;
    const [minMv,maxMv]=getCellScaleMv();
    lines.push(`Cells: ${act.length} · Σ=${fmt(sum,'V',3)} · Min/Max=${min.toFixed(3)}/${max.toFixed(3)} V · Δ=${deltaMv.toFixed(1)} mV`);
    if (Number.isFinite(diffMv)) lines.push(`Pack − Σcells = ${diffMv.toFixed(1)} mV`);
    lines.push(`Scale: ${(minMv/1000).toFixed(3)}–${(maxMv/1000).toFixed(3)} V`);
  } else lines.push('Cells: –');
  const now=Date.now();
  lines.push(`Freshness: cells ${ago(STATE.lastCellsTs, now)}, pack ${ago(STATE.lastSummaryTs, now)}`);
  return lines.join('\n');
}
function fmt(v,u,d){ return Number.isFinite(v)? `${v.toFixed(d)} ${u}` : `– ${u}`; }
/* FIX: человекочитаемая «свежесть», без «0 ms ago» */
function ago(ts,now){
  if(!ts) return '—';
  const ms = Math.max(0, now - ts);
  if (ms < 1500) return 'now';
  if (ms < 60000) return `${(ms/1000).toFixed(1)} s ago`;
  if (ms < 3600000) return `${Math.floor(ms/60000)} m ago`;
  if (ms < 86400000) return `${Math.floor(ms/3600000)} h ago`;
  return `${Math.floor(ms/86400000)} d ago`;
}

/* Cells updater (hide 0V) */
function updateCellsSimple(volts){
  const [minMv, maxMv] = getCellScaleMv();
  const finite = volts.filter(v=>Number.isFinite(v) && v>0);
  const n = finite.length;
  const min = n ? Math.min(...finite) : NaN;
  const max = n ? Math.max(...finite) : NaN;
  const avg = n ? finite.reduce((a,b)=>a+b,0)/n : NaN;

  for (let i=0;i<CELL_COUNT;i++){
    const v = volts[i];
    const slot = simpleSlots[i];
    if (!slot) continue;

    if (!Number.isFinite(v) || v <= 0){
      slot.cardEl.style.display = 'none';
      continue;
    }
    slot.cardEl.style.display = '';

    slot.valEl.textContent = v.toFixed(3)+' V';
    const perc = clamp( Math.round( map(v*1000, minMv, maxMv, 0, 100) ), 0, 100 );
    slot.fillEl.style.width = perc + '%';

    let flagText = '';
    if (Number.isFinite(min) && Math.abs(v - avg) > 0.040 && v === min) { flagText='LOW'; slot.flagEl.className='cell-flag flag-min'; }
    else if (Number.isFinite(max) && Math.abs(v - avg) > 0.040 && v === max) { flagText='HIGH'; slot.flagEl.className='cell-flag flag-max'; }
    else { slot.flagEl.className='cell-flag'; }
    slot.flagEl.textContent = flagText;
  }
}

/* === JK / JBD (как было) === */
function sumCrc(frame,len){ let c=0; for(let i=0;i<len;i++) c=(c+(frame[i]&0xFF))&0xFF; return c; }
async function makeJk(server){
  const svc = await server.getPrimaryService(UUID.JK_SVC);
  const chr = await svc.getCharacteristic(UUID.JK_CHR);
  const ctrl = chr;
  const buf=[];
  let lastRx = Date.now();
  let watchdog = null;

  async function writeCmd(cmd,value=0,len=0){
    const frame=new Uint8Array(20);
    frame[0]=0xAA; frame[1]=0x55; frame[2]=0x90; frame[3]=0xEB; frame[4]=cmd; frame[5]=len;
    frame[6]=(value)&0xFF; frame[7]=(value>>8)&0xFF; frame[8]=(value>>16)&0xFF; frame[9]=(value>>24)&0xFF;
    frame[19]=sumCrc(frame,19);

    const props = ctrl.properties || {};
    try{
      if (props.writeWithoutResponse) { await ctrl.writeValueWithoutResponse(frame); return; }
      if (props.write) { await ctrl.writeValueWithResponse(frame); return; }
      await ctrl.writeValue(frame);
    }catch(e){
      try{
        if (props.write) { await ctrl.writeValueWithResponse(frame); return; }
        if (typeof ctrl.writeValueWithoutResponse === 'function') { await ctrl.writeValueWithoutResponse(frame); return; }
        await ctrl.writeValue(frame);
      }catch(ex){ throw ex; }
    }
  }

  async function start(){
    await chr.startNotifications();
    await new Promise(r=>setTimeout(r,120));
    chr.addEventListener('characteristicvaluechanged', onNotify);
    await writeCmd(0x97,0,0);
    await writeCmd(0x96,0,0);
    watchdog = setInterval(()=>{ if (Date.now()-lastRx>3000) writeCmd(0x96,0,0).catch(()=>{}); }, 1000);
  }

  function u16(d,i){ return ((d[i+1]<<8)|d[i]) & 0xFFFF; }
  function s16(d,i){ let v=u16(d,i); return (v&0x8000)? (v-0x10000): v; }
  function u32(d,i){ return ((u16(d,i+2)<<16)|u16(d,i))>>>0; }
  function s32(d,i){ let v=u32(d,i); return (v&0x80000000)? (v-0x100000000): v; }

  function plausibleTotals(total,cells){
    const act=cells.filter(v=>Number.isFinite(v)&&v>0);
    const n=Math.max(1,act.length);
    const lo=1.5*n, hi=5.0*n;
    return Number.isFinite(total)&&total>=lo&&total<=hi;
  }

  function onNotify(ev){
    const view = ev.target.value;
    const chunk = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
    const idx=idxOfHeader(chunk);
    if (idx>=0) { buf.length=0; buf.push(...chunk.slice(idx)); }
    else buf.push(...chunk);

    if (buf.length>=300){
      const candidates=[300,320,352,368,384,buf.length];
      for(const size of candidates){
        if (buf.length<size) break;
        const d=buf.slice(0,size);
        if (d[0]===0x55&&d[1]===0xAA&&d[2]===0xEB&&d[3]===0x90){
          const crc=sumCrc(d,size-1);
          if (crc===(d[size-1]&0xFF)){
            try{ parseFrame(d); lastRx = Date.now(); }catch(ex){ console.warn('JK parse',ex);}
            buf.length=0; return;
          }
        }
      }
      if (buf.length>512) buf.length=0;
    }
  }
  function idxOfHeader(a){ for(let i=0;i<=a.length-4;i++) if(a[i]===0x55&&a[i+1]===0xAA&&a[i+2]===0xEB&&a[i+3]===0x90) return i; return -1; }

  function parseFrame(d){
    const type=d[4];
    if (type===0x03) return;
    if (type===0x01){
      const parsed = tryParseJK02Settings(d);
      if (parsed) applySettings(parsed);
      return;
    }
    if (type===0x02){
      const parsed = tryParseJK02(d,0) || tryParseJK02(d,32) || tryParseJK04(d);
      if (parsed) applyState(parsed);
      return;
    }
  }

  function tryParseJK02Settings(d){
    try{
      const uvp = Math.round(u32(d,10) * 1.0);
      const ovp = Math.round(u32(d,18) * 1.0);
      const soc100 = Math.round(u32(d,30) * 1.0);
      const soc0   = Math.round(u32(d,34) * 1.0);
      const okU = Number.isFinite(uvp) && uvp>1000 && uvp<5000;
      const okO = Number.isFinite(ovp) && ovp>2000 && ovp<5000;
      const okS = Number.isFinite(soc0) && Number.isFinite(soc100) && soc100>soc0 && soc100<5000 && soc0>1000;
      return {
        cfgUvpMv: okU?uvp:NaN,
        cfgOvpMv: okO?ovp:NaN,
        cfgSoc0mV: okS?soc0:NaN,
        cfgSoc100mV: okS?soc100:NaN
      };
    }catch{ return null; }
  }

  function tryParseJK02(d,off){
    try{
      const cells=[];
      for(let i=0;i<32;i++){
        const pos=6+i*2; if (pos+1>=d.length) break;
        cells.push(u16(d,pos)*0.001);
      }
      const total = u32(d,118+off) * 0.001;
      const current = s32(d,126+off) * 0.001;
      const t0=s16(d,130+off)*0.1, t1=s16(d,132+off)*0.1;

      let tmos = (134+off+1<d.length)? s16(d,134+off)*0.1 : NaN;
      if (!Number.isFinite(tmos) && 112+off+1<d.length) tmos = s16(d,112+off)*0.1;

      let errMask=-1;
      if (136+off+1<d.length) errMask=(d[136+off]<<8)|d[136+off+1];
      else if (134+off+1<d.length) errMask=(d[134+off]<<8)|d[134+off+1];

      const balancing=(140+off)<d.length && d[140+off]!==0x00;
      const soc=(141+off)<d.length ? d[141+off] : NaN;
      const capRem=(142+off+3<d.length)? u32(d,142+off)*0.001 : NaN;

      if (!plausibleTotals(total,cells)) return null;

      return {cells,totalV:total,current,t0,t1,tmos,soc,balancing,capRem,errors:errorsFromMaskJK(errMask)};
    }catch{ return null; }
  }
  function tryParseJK04(d){
    try{
      const cells=[]; for (let i=0;i<24;i++){ const pos=6+i*4; if (pos+3>=d.length) break; const view=new DataView(new Uint8Array(d.slice(pos,pos+4)).buffer); cells.push(view.getFloat32(0,true)); }
      if (!cells.length) return null; const total=cells.filter(v=>Number.isFinite(v)&&v>0).reduce((a,b)=>a+b,0);
      return {cells,totalV:total,current:NaN,t0:NaN,t1:NaN,tmos:NaN,soc:NaN,balancing:false,capRem:NaN,errors:''};
    }catch{ return null; }
  }
  function errorsFromMaskJK(mask){
    if (!(mask>0)) return 'OK';
    const names=['Charge Overtemp','Charge Undertemp','Coprocessor comm','Cell Undervoltage','Pack Undervoltage','Discharge Overcurrent','Discharge Short','Discharge Overtemp','Wire Resistance','MOSFET Overtemp','Cell Count Mismatch','Current Sensor Anomaly','Cell Overvoltage','Pack Overvoltage','Charge Overcurrent','Charge Short'];
    const list=[]; for(let i=0;i<names.length;i++) if(mask&(1<<i)) list.push(names[i]); return list.join('; ');
  }
  function applySettings(p){
    if (!p) return;
    if (Number.isFinite(p.cfgSoc0mV)) STATE.cfgSoc0mV = p.cfgSoc0mV;
    if (Number.isFinite(p.cfgSoc100mV)) STATE.cfgSoc100mV = p.cfgSoc100mV;
    if (Number.isFinite(p.cfgUvpMv)) STATE.cfgUvpMv = p.cfgUvpMv;
    if (Number.isFinite(p.cfgOvpMv)) STATE.cfgOvpMv = p.cfgOvpMv;
    onStateUpdate();
  }
  function applyState(p){
    if (p.cells?.length){ STATE.cells=p.cells.slice(0,CELL_COUNT); STATE.lastCellsTs=Date.now(); }
    if (Number.isFinite(p.totalV)) STATE.totalV=p.totalV;
    if (Number.isFinite(p.current)) STATE.current=p.current;
    if (Number.isFinite(p.t0)) STATE.temp1=p.t0;
    if (Number.isFinite(p.t1)) STATE.temp2=p.t1;
    if (Number.isFinite(p.tmos)) STATE.tmos=p.tmos;
    if (Number.isFinite(p.soc)) STATE.soc=p.soc;
    if (Number.isFinite(p.capRem)) STATE.capRem=p.capRem;
    STATE.balancing=!!p.balancing;
    if (p.errors) STATE.errors=p.errors;
    STATE.lastSummaryTs=Date.now();
    onStateUpdate();
  }
  async function disconnect(){
    try{ chr.removeEventListener('characteristicvaluechanged', onNotify); await chr.stopNotifications(); }catch{}
    try{ if (watchdog) clearInterval(watchdog); }catch{}
    try{ await server.disconnect?.(); }catch{}
  }
  return { start, disconnect, get connected(){ return server.connected; }, onupdate:null, onlog:null };
}

function jbdChecksum(data,offset,len){ let sum=0; for(let i=0;i<len;i++) sum=(sum - (data[offset+i]&0xFF))&0xFFFF; return sum; }
async function makeJbd(server){
  let kickCells = null, kickInfo = null;
  const svc = await server.getPrimaryService(UUID.JBD_SVC);
  const chrN = await svc.getCharacteristic(UUID.JBD_NOTIFY);
  const chrC = await svc.getCharacteristic(UUID.JBD_CTRL);

  async function jbdRead(reg){
    const frame = new Uint8Array(7);
    frame[0]=0xDD; frame[1]=0xA5; frame[2]=reg; frame[3]=0x00;
    const crc = jbdChecksum(frame,2,2);
    frame[4]=(crc>>8)&0xFF; frame[5]=crc&0xFF; frame[6]=0x77;

    const props = chrC.properties || {};
    try{
      if (props.writeWithoutResponse) await chrC.writeValueWithoutResponse(frame);
      else if (props.write) await chrC.writeValueWithResponse(frame);
      else await chrC.writeValue(frame);
    }catch{
      try{
        if (props.write) await chrC.writeValueWithResponse(frame);
        else if (typeof chrC.writeValueWithoutResponse === 'function') await chrC.writeValueWithoutResponse(frame);
        else await chrC.writeValue(frame);
      }catch(e){ /* swallow */ }
    }
  }

  async function start(){
    await chrN.startNotifications();
    chrN.addEventListener('characteristicvaluechanged', onNotify);

    await jbdRead(0x03);
    await jbdRead(0x04);
    await jbdRead(0x05);

    kickCells = setInterval(() => jbdRead(0x04).catch(()=>{}), 2000);
    kickInfo  = setInterval(() => jbdRead(0x03).catch(()=>{}), 3000);
  }
  const buf=[];
  function onNotify(ev){
    const view = ev.target.value;
    const d = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
    for (const b of d) buf.push(b);

    while (true) {
      while (buf.length >= 1 && buf[0] !== 0xDD) buf.shift();
      if (buf.length < 7) return;

      const dataLen = buf[3];
      const frameLen = 4 + dataLen + 3;
      if (frameLen < 7) { buf.shift(); continue; }
      if (buf.length < frameLen) return;

      if (buf[frameLen - 1] !== 0x77) { buf.shift(); continue; }

      const frame = buf.splice(0, frameLen);
      const crcRemote = ((frame[frameLen-3] << 8) | frame[frameLen-2]) & 0xFFFF;
      const crcLocal  = jbdChecksum(frame, 2, 2 + dataLen);
      if (crcLocal !== crcRemote) { continue; }

      parseJbdFrame(frame);
    }
  }
  function parseJbdFrame(frame){
    const fn  = frame[1];
    const len = frame[3];
    const data = frame.slice(4, 4 + len);

    if (fn === 0x05) { return; }
    if (fn === 0x03) { parseHwInfo(data); return; }
    if (fn === 0x04) { parseCellInfo(data); return; }
  }
  function u16(d,i){ return ((d[i]<<8)|d[i+1])&0xFFFF; }
  function s16(d,i){ let v=u16(d,i); if (v&0x8000) v-=0x10000; return v; }
  function u32(d,i){ return ((u16(d,i)<<16)|u16(d,i+2))>>>0; }
  function parseHwInfo(d){
    const totalV=u16(d,0)*0.01;
    const current=s16(d,2)*0.01;
    const capRem=u16(d,4)*0.01;
    const cycles=u16(d,8);
    const balMask=u32(d,12);
    const errMask=u16(d,16);
    const soc=d[19];
    const tempCnt=Math.min(d[22],6);
    const temps=[]; for(let i=0;i<tempCnt;i++){ temps.push( (u16(d,23+i*2)-2731)*0.1 ); }
    STATE.totalV=totalV; STATE.current=current; STATE.capRem=capRem; STATE.soc=soc; STATE.balancing=balMask!==0; STATE.temp1=temps[0]??NaN; STATE.temp2=temps[1]??NaN; STATE.tmos=temps[2]??NaN;
    STATE.errors = errorsFromMaskJbd(errMask) || 'OK'; STATE.lastSummaryTs=Date.now(); onStateUpdate();
  }
  function parseCellInfo(d){
    if (d.length<2 || d.length>64 || (d.length%2)!==0) return;
    const cells=[]; for(let i=0;i<Math.min(d.length/2,32);i++){ cells.push(u16(d,i*2)*0.001); }
    STATE.cells=cells.slice(0,CELL_COUNT); STATE.lastCellsTs=Date.now(); onStateUpdate();
  }
  function errorsFromMaskJbd(mask){
    if (!mask) return 'OK';
    const names=['Cell overvoltage','Cell undervoltage','Pack overvoltage','Pack undervoltage','Charging over temperature','Charging under temperature','Discharging over temperature','Discharging under temperature','Charging overcurrent','Discharging overcurrent','Short circuit','IC front-end error','Mosfet Software Lock','Charge timeout Close','Unknown(0x0E)','Unknown(0x0F)'];
    const out=[]; for(let i=0;i<names.length;i++) if(mask&(1<<i)) out.push(names[i]); return out.join('; ');
  }
  async function disconnect(){
    try { chrN.removeEventListener('characteristicvaluechanged', onNotify); await chrN.stopNotifications(); } catch {}
    try { if (kickCells) clearInterval(kickCells); if (kickInfo) clearInterval(kickInfo); } catch {}
    try { await server.disconnect?.(); } catch {}
  }
  return { start, disconnect, get connected(){ return server.connected; }, onupdate:null, onlog:null };
}

<script>
/* === Battery logger to PowerAPI (без изменений) === */
const API_BASE = 'https://bms.area.pp.ua';
let DEVICE_ID = 'unknown';
function toUrlSafe(id) { return id.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
let DEVICE_ID_SAFE = toUrlSafe(DEVICE_ID);
let DEVICE_NAME = '';
let _logTimer = null;
let _lastSentAt = 0;
let _lastHash = '';

function startLogger() {
  if (_logTimer) return;
  _logTimer = setInterval(trySendSample, 1000);
  document.addEventListener('visibilitychange', onVisChange, { passive: true });
  window.addEventListener('beforeunload', flushBeacon);
}
function stopLogger() {
  if (_logTimer) { clearInterval(_logTimer); _logTimer = null; }
  document.removeEventListener('visibilitychange', onVisChange);
  window.removeEventListener('beforeunload', flushBeacon);
}
function onVisChange() { if (document.visibilityState === 'hidden') flushBeacon(); }

async function trySendSample() {
  const s = collectSample();
  if (!s) return;
  const fingerprint = JSON.stringify([s.totalV, s.current, s.soc, s.powerW, s.cells]);
  const stale = (Date.now() - _lastSentAt) > 10_000;
  if (!stale && fingerprint === _lastHash) return;
  try {
    await postSample(s);
    _lastHash = fingerprint;
    _lastSentAt = Date.now();
  } catch (e) {
    console.warn('log send failed', e);
  }
}
function collectSample() {
  try {
    const cells = (STATE.cells || []).filter(v=>Number.isFinite(v) && v>0).slice(0, CELL_COUNT);
    const sum = cells.reduce((a, b) => a + b, 0);
    const diffMv = (Number.isFinite(STATE.totalV) && cells.length) ? Math.round((STATE.totalV - sum) * 1000) : null;
    const [minMv, maxMv] = getCellScaleMv();
    const v = Number.isFinite(STATE.totalV) ? STATE.totalV : null;
    const i = Number.isFinite(STATE.current) ? STATE.current : null;
    const power = (v != null && i != null) ? v * i : null;

    return {
      deviceName: DEVICE_NAME || 'Battery',
      timestamp: new Date().toISOString(),
      totalV: v, current: i, soc: Number.isFinite(STATE.soc) ? STATE.soc : null,
      capRem: Number.isFinite(STATE.capRem) ? STATE.capRem : null,
      temp1: Number.isFinite(STATE.temp1) ? STATE.temp1 : null,
      temp2: Number.isFinite(STATE.temp2) ? STATE.temp2 : null,
      tmos: Number.isFinite(STATE.tmos) ? STATE.tmos : null,
      balancing: !!STATE.balancing,
      errors: (STATE.errors || '').trim() || null,
      powerW: Number.isFinite(power) ? power : null,
      scaleMinMv: Number.isFinite(minMv) ? minMv : null,
      scaleMaxMv: Number.isFinite(maxMv) ? maxMv : null,
      packSumDiffMv: Number.isFinite(diffMv) ? diffMv : null,
      cells: cells.length ? cells : null,
      pageUrl: location.href,
      source: 'web-bt'
    };
  } catch { return null; }
}
async function postSample(sample) {
  const url = `${API_BASE}/api/batteries/samples`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sample),
    keepalive: true,
    mode: 'cors'
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}
function flushBeacon() {
  try {
    const s = collectSample();
    if (!s) return;
    const url = `${API_BASE}/api/batteries/${DEVICE_ID_SAFE}/samples`;
    const blob = new Blob([JSON.stringify(s)], { type: 'application/json' });
    navigator.sendBeacon(url, blob);
  } catch { }
}

async function readDeviceIdentity(device) {
  try {
    const server = device.gatt.connected ? device.gatt : await device.gatt.connect();
    const dis = await server.getPrimaryService(DIS_UUID);
    try {
      const ch = await dis.getCharacteristic(CHR_SERIAL);
      const v = await ch.readValue();
      const serial = new TextDecoder().decode(v).trim();
      if (serial) return { raw: `sn:${serial}`, pretty: serial };
    } catch { }
    try {
      const ch = await dis.getCharacteristic(CHR_SYSTEM_ID);
      const v = await ch.readValue();
      const sysid = hex(v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength));
      if (sysid) return { raw: `sysid:${sysid}`, pretty: sysid };
    } catch { }
  } catch { }
  return { raw: `dev:${device.id}`, pretty: device.id };
}

const _orig_connectViaGrantedDevice = connectViaGrantedDevice;
connectViaGrantedDevice = async function (device) {
  DEVICE_NAME = (device?.name || 'Battery').toString();
  await _orig_connectViaGrantedDevice.call(this, device);
  if (ble?.connected) startLogger();
};
(function patchDisconnect() {
  const addDisc = (b) => {
    if (!b || typeof b.disconnect !== 'function') return;
    const orig = b.disconnect.bind(b);
    b.disconnect = async () => { try { await orig(); } finally { stopLogger(); } };
  };
  const iv = setInterval(() => { if (ble) { addDisc(ble); clearInterval(iv); } }, 300);
})();
</script>
